<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapo Imaginário - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Sapo Imaginário</h1>
      <p>Veja um pouco do meu portfólio e projetos que estou participando!</p>
    </header>
    <div id="top-image"></div>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">Sobre Mim</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html" class="active">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>

    <section id="sapo-imaginario" style="padding: 0 16px;">
      <div id="project-grid" class="project-grid"></div>
    </section>

    <!-- Preview Drawer -->
    <div id="previewOverlay" class="preview-overlay" onclick="closePreview()"></div>
    <div id="previewDrawer" class="preview-drawer" role="dialog" aria-modal="true">
      <div class="preview-drawer-header">
        <span id="previewTitle" class="preview-drawer-title"></span>
        <div class="preview-drawer-controls">
          <a id="previewNewTab" href="#" target="_blank" rel="noopener" class="btn-newtab" style="display:none">↗ Abrir em nova aba</a>
          <button class="icon-btn" onclick="closePreview()" aria-label="Fechar preview">✕</button>
        </div>
      </div>
      <div class="preview-drawer-body">
        <iframe id="previewIframe" src="" title="Preview do projeto" style="display:none; width:100%; height:100%; border:none;"></iframe>
        <div id="previewContent" class="preview-post-content" style="display:none"></div>
      </div>
    </div>

    <script src="search.js"></script>
    <script>
      function loadProjects() {
          const grid = document.getElementById('project-grid');
          grid.innerHTML = '<p class="post-loading" style="grid-column:1/-1">Carregando projetos...</p>';

          fetch(`${API_BASE}/posts?url=${encodeURIComponent('sapo-imaginario.html')}&limit=50`)
              .then(r => r.json())
              .then(data => {
                  const posts = (data.posts || []);
                  grid.innerHTML = '';
                  if (!posts.length) {
                      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:32px 0; color:var(--color-text-secondary)">Nenhum projeto ainda. Em breve!</p>';
                      return;
                  }
                  posts.forEach(post => grid.appendChild(buildCard(post)));
              })
              .catch(() => {
                  grid.innerHTML = '<p class="post-error" style="grid-column:1/-1">Erro ao carregar projetos. Tente novamente.</p>';
              });
      }

      function buildCard(post) {
          const link = post.slug ? `post.html?slug=${post.slug}` : `post.html?id=${post._id}`;
          const imgSrc = post.image_path
              ? (post.image_path.startsWith('http') ? post.image_path : '/imagens/uploads/' + post.image_path)
              : null;
          const tmp = document.createElement('div');
          tmp.innerHTML = post.content || '';
          const text = (tmp.textContent || '').trim();
          const excerpt = text.length > 115 ? text.substring(0, 115) + '...' : text;
          const techs = (post.technologies || []);
          const extLink = post.external_link || '';

          const card = document.createElement('article');
          card.className = 'project-card';

          const imgHtml = imgSrc
              ? `<a href="${link}"><img src="${imgSrc}" alt="${post.title}" loading="lazy"></a>`
              : '<div class="project-card-img-placeholder">🌿</div>';

          const techHtml = techs.length
              ? `<div class="tech-tags">${techs.map(t => `<span class="tech-tag">${t}</span>`).join('')}</div>`
              : '';

          const verHtml = extLink
              ? `<a href="${extLink}" target="_blank" rel="noopener" class="btn-ver-projeto">Ver Projeto ↗</a>`
              : '';

          card.innerHTML = `
              <div class="project-card-img">${imgHtml}</div>
              <div class="project-card-body">
                  <h3><a href="${link}">${post.title}</a></h3>
                  <p>${excerpt}</p>
                  ${techHtml}
                  <div class="project-card-actions">
                      <button class="btn-preview">◈ Preview</button>
                      ${verHtml}
                  </div>
              </div>`;

          card.querySelector('.btn-preview').addEventListener('click', () => {
              openPreview(post._id, extLink, post.title);
          });

          return card;
      }

      function openPreview(postId, externalLink, title) {
          const drawer   = document.getElementById('previewDrawer');
          const overlay  = document.getElementById('previewOverlay');
          const titleEl  = document.getElementById('previewTitle');
          const newTabBtn = document.getElementById('previewNewTab');
          const iframe   = document.getElementById('previewIframe');
          const content  = document.getElementById('previewContent');

          titleEl.textContent = title;
          iframe.style.display = 'none';
          content.style.display = 'none';
          iframe.src = '';
          content.innerHTML = '';

          if (externalLink) {
              iframe.src = externalLink;
              iframe.style.display = 'block';
              newTabBtn.href = externalLink;
              newTabBtn.style.display = 'inline-flex';
          } else {
              content.style.display = 'block';
              content.innerHTML = '<p class="post-loading">Carregando...</p>';
              newTabBtn.style.display = 'none';
              fetch(`${API_BASE}/post/${postId}`)
                  .then(r => r.json())
                  .then(p => { content.innerHTML = `<div class="content-body">${p.content}</div>`; })
                  .catch(() => { content.innerHTML = '<p>Erro ao carregar conteúdo.</p>'; });
          }

          overlay.classList.add('open');
          drawer.classList.add('open');
          document.body.style.overflow = 'hidden';
      }

      function closePreview() {
          const drawer  = document.getElementById('previewDrawer');
          const overlay = document.getElementById('previewOverlay');
          const iframe  = document.getElementById('previewIframe');
          drawer.classList.remove('open');
          overlay.classList.remove('open');
          document.body.style.overflow = '';
          setTimeout(() => { iframe.src = ''; }, 350);
      }

      document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

      window.onload = loadProjects;
    </script>

    <div id="bottom-image"></div>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa © 2024–2026 Nay</p>
        <div class="footer-links">
          <a href="https://github.com/nayfts" target="_blank" rel="noopener">GitHub</a>
          <a href="/api/feed.xml" target="_blank">RSS</a>
        </div>
      </div>
    </footer>
  </body>
</html>
