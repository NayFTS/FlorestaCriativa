<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Postagens - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Gerencie suas postagens aqui.</p>
    </header>

    <div class="manage-posts-container">
      <h2>Suas Postagens</h2>
      <table id="postsTable">
        <thead>
          <tr>
            <th>Título</th>
            <th>Status</th>
            <th>Data</th>
            <th>Views</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

  function loadPosts() {
      fetch(`${API_BASE}/user-posts`)
          .then(response => {
              if (!response.ok) {
                  window.location.href = 'login.html';
                  throw new Error('Não autenticado');
              }
              return response.json();
          })
          .then(posts => {
              const tbody = document.querySelector('#postsTable tbody');
              tbody.innerHTML = '';

              if (posts.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="5">Nenhuma postagem encontrada.</td></tr>';
                  return;
              }

              posts.forEach(post => {
                  const isDraft = post.status === 'draft';
                  const row = document.createElement('tr');
                  row.innerHTML = `
                      <td>${post.title}</td>
                      <td><span class="badge ${isDraft ? 'badge-draft' : 'badge-published'}">${isDraft ? 'Rascunho' : 'Publicado'}</span></td>
                      <td>${new Date(post.publish_date).toLocaleDateString('pt-BR')}</td>
                      <td>${post.views || 0}</td>
                      <td></td>
                  `;

                  const actionsCell = row.querySelector('td:last-child');

                  const editBtn = document.createElement('button');
                  editBtn.textContent = 'Editar';
                  editBtn.onclick = () => window.location.href = `editPost.html?id=${post._id}`;
                  actionsCell.appendChild(editBtn);

                  if (isDraft) {
                      const publishBtn = document.createElement('button');
                      publishBtn.textContent = 'Publicar';
                      publishBtn.style.backgroundColor = '#4a8a4a';
                      publishBtn.onclick = () => publishPost(post._id, publishBtn);
                      actionsCell.appendChild(publishBtn);
                  }

                  const deleteBtn = document.createElement('button');
                  deleteBtn.textContent = 'Excluir';
                  deleteBtn.style.backgroundColor = '#c0392b';
                  deleteBtn.setAttribute('data-id', post._id);
                  deleteBtn.onclick = () => deletePost(post._id);
                  actionsCell.appendChild(deleteBtn);

                  tbody.appendChild(row);
              });
          })
          .catch(error => console.error('Erro ao carregar postagens:', error));
  }

  function publishPost(postId, btn) {
      btn.disabled = true;
      btn.textContent = 'Publicando...';
      fetch(`${API_BASE}/posts/${postId}/publish`, { method: 'PATCH', credentials: 'include' })
          .then(r => r.json())
          .then(data => {
              if (data.success) loadPosts();
              else { btn.disabled = false; btn.textContent = 'Publicar'; }
          })
          .catch(() => { btn.disabled = false; btn.textContent = 'Publicar'; });
  }

  function deletePost(postId) {
      if (!confirm('Tem certeza que deseja excluir esta postagem?')) return;
      const btn = document.querySelector(`button[data-id="${postId}"]`);
      if (btn) { btn.textContent = 'Excluindo...'; btn.disabled = true; }

      fetch(`${API_BASE}/posts/${postId}`, { method: 'DELETE', credentials: 'include' })
          .then(response => {
              if (!response.ok) throw new Error('Erro ao excluir');
              loadPosts();
          })
          .catch(error => {
              console.error('Erro ao excluir postagem:', error);
              if (btn) { btn.disabled = false; btn.textContent = 'Excluir'; }
          });
  }

  window.onload = loadPosts;
    </script>

    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
