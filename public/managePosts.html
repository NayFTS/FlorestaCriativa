<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Postagens - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Gerencie suas postagens aqui.</p>
    </header>
    <div id="top-image"></div>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <a href="#" id="logoutButton">Sair</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <div class="search-overlay-box-header">
          <span style="font-weight:600;font-size:1em;">Pesquisar</span>
          <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        </div>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>
    <!-- Modal de confirmação de exclusão -->
    <div id="deleteModal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <p>Tem certeza que deseja excluir esta postagem?</p>
        <div class="modal-actions">
          <button id="modalCancel" class="btn-secondary">Cancelar</button>
          <button id="modalConfirm" class="btn-danger">Excluir</button>
        </div>
      </div>
    </div>

    <div class="manage-posts-container">
      <h2>Suas Postagens</h2>
      <div id="paginationControls" class="pagination-controls"></div>
      <table id="postsTable">
        <thead>
          <tr>
            <th>Título</th>
            <th>Status</th>
            <th>Data</th>
            <th>Views</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
  const API_BASE = '/api';

  let allPosts = [];
  let currentPage = 1;
  const PAGE_SIZE = 10;

  function loadPosts() {
      fetch(`${API_BASE}/user-posts`)
          .then(response => {
              if (!response.ok) {
                  window.location.href = 'login.html';
                  throw new Error('Não autenticado');
              }
              return response.json();
          })
          .then(posts => {
              allPosts = posts;
              renderPage(1);
          })
          .catch(error => console.error('Erro ao carregar postagens:', error));
  }

  function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const pagePosts = allPosts.slice(start, start + PAGE_SIZE);
      const totalPages = Math.ceil(allPosts.length / PAGE_SIZE);
      const tbody = document.querySelector('#postsTable tbody');
      tbody.innerHTML = '';

      if (allPosts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">Nenhuma postagem encontrada.</td></tr>';
          updatePaginationUI(0, 0);
          return;
      }

      pagePosts.forEach(post => {
          const isDraft = post.status === 'draft';
          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${post.title}</td>
              <td><span class="badge ${isDraft ? 'badge-draft' : 'badge-published'}">${isDraft ? 'Rascunho' : 'Publicado'}</span></td>
              <td>${new Date(post.publish_date).toLocaleDateString('pt-BR')}</td>
              <td>${post.views || 0}</td>
              <td></td>
          `;

          const actionsCell = row.querySelector('td:last-child');

          const editBtn = document.createElement('button');
          editBtn.textContent = 'Editar';
          editBtn.onclick = () => window.location.href = `editPost.html?id=${post._id}`;
          actionsCell.appendChild(editBtn);

          if (isDraft) {
              const publishBtn = document.createElement('button');
              publishBtn.textContent = 'Publicar';
              publishBtn.style.backgroundColor = '#4a8a4a';
              publishBtn.onclick = () => publishPost(post._id, publishBtn);
              actionsCell.appendChild(publishBtn);
          }

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Excluir';
          deleteBtn.style.backgroundColor = '#c0392b';
          deleteBtn.setAttribute('data-id', post._id);
          deleteBtn.onclick = () => deletePost(post._id);
          actionsCell.appendChild(deleteBtn);

          tbody.appendChild(row);
      });

      updatePaginationUI(page, totalPages);
  }

  function updatePaginationUI(page, totalPages) {
      const container = document.getElementById('paginationControls');
      container.innerHTML = '';
      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '← Anterior';
      prevBtn.disabled = page === 1;
      prevBtn.onclick = () => renderPage(page - 1);
      container.appendChild(prevBtn);

      const info = document.createElement('span');
      info.textContent = `Página ${page} de ${totalPages}`;
      container.appendChild(info);

      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Próxima →';
      nextBtn.disabled = page === totalPages;
      nextBtn.onclick = () => renderPage(page + 1);
      container.appendChild(nextBtn);
  }

  function publishPost(postId, btn) {
      btn.disabled = true;
      btn.textContent = 'Publicando...';
      fetch(`${API_BASE}/posts/${postId}/publish`, { method: 'PATCH', credentials: 'include' })
          .then(r => r.json())
          .then(data => {
              if (data.success) loadPosts();
              else { btn.disabled = false; btn.textContent = 'Publicar'; }
          })
          .catch(() => { btn.disabled = false; btn.textContent = 'Publicar'; });
  }

  function confirmDelete() {
      return new Promise(resolve => {
          const modal = document.getElementById('deleteModal');
          modal.style.display = 'flex';
          document.getElementById('modalConfirm').onclick = () => {
              modal.style.display = 'none';
              resolve(true);
          };
          document.getElementById('modalCancel').onclick = () => {
              modal.style.display = 'none';
              resolve(false);
          };
      });
  }

  async function deletePost(postId) {
      const confirmed = await confirmDelete();
      if (!confirmed) return;

      const btn = document.querySelector(`button[data-id="${postId}"]`);
      if (btn) { btn.textContent = 'Excluindo...'; btn.disabled = true; }

      fetch(`${API_BASE}/posts/${postId}`, { method: 'DELETE', credentials: 'include' })
          .then(response => {
              if (!response.ok) throw new Error('Erro ao excluir');
              loadPosts();
          })
          .catch(error => {
              console.error('Erro ao excluir postagem:', error);
              if (btn) { btn.disabled = false; btn.textContent = 'Excluir'; }
          });
  }

  window.onload = loadPosts;
    </script>

    <div id="bottom-image"></div>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa &copy; 2026</p>
      </div>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
