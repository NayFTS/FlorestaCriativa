    <div class="container" id="post-content">
      <!-- Conteúdo do post carregado aqui -->
    </div>
    <div class="back-button-container">
      <button onclick="goBack()">Voltar</button>
    </div>
    <script src="search.js"></script>
    <script>
function fetchPost() {
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('slug') || urlParams.get('id');

    if (!postId || postId === 'undefined') {
        document.getElementById('post-content').innerHTML = '<p class="post-error">Post não encontrado.</p>';
        return;
    }

    fetch(`${API_BASE}/post/${postId}`)
        .then(response => {
            if (!response.ok) throw new Error('Post não encontrado');
            return response.json();
        })
        .then(data => {
            document.title = `${data.title} — Floresta Criativa`;

            const desc = (data.content || '').replace(/<[^>]+>/g, '').trim().substring(0, 160);
            document.querySelector('meta[name="description"]').setAttribute('content', desc);
            document.querySelector('meta[property="og:title"]').setAttribute('content', data.title);
            document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
            if (data.image_path) {
                const ogImg = data.image_path.startsWith('http') ? data.image_path : `${window.location.origin}/imagens/uploads/${data.image_path}`;
                document.querySelector('meta[property="og:image"]').setAttribute('content', ogImg);
            }

            const postContainer = document.getElementById('post-content');
            const publishDate = new Date(data.publish_date).toLocaleDateString('pt-BR', {
                day: '2-digit', month: 'long', year: 'numeric'
            });
            const resolveImg = (p) => p.startsWith('http') ? p : `/imagens/uploads/${p}`;
            const imageHTML = data.image_path
                ? `<img src="${resolveImg(data.image_path)}" alt="${data.title}" style="max-width:100%;height:auto;border-radius:10px;margin-bottom:20px;">`
                : '';
            const categoriesHTML = data.categories && data.categories.length > 0
                ? data.categories.join(', ') : 'Sem categoria';

            postContainer.innerHTML = `
                <h2>${data.title}</h2>
                ${imageHTML}
                <div class="content-body">${data.content}</div>
                <p class="post-meta"><strong>Publicado em:</strong> ${publishDate} &nbsp;·&nbsp; <strong>Visualizações:</strong> ${data.views || 0}</p>
                <p class="post-categories"><strong>Categorias:</strong> ${categoriesHTML}</p>
            `;
        })
        .catch(error => {
            console.error('Erro ao buscar post:', error);
            document.getElementById('post-content').innerHTML = '<p class="post-error">Erro ao carregar a postagem.</p>';
        });
}

function goBack() { window.history.back(); }

window.onload = fetchPost;
    </script>
