<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Completo - Floresta Criativa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Bem-vindo ao meu espaço de escrita, projetos e inspiração!</p>
    </header>
    <div id="top-image"></div>
    <!-- Isso substitui a tag img -->
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <!-- Ícone de hambúrguer -->
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">Sobre Mim</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <!-- Formulário de pesquisa agora está dentro do nav -->
        <form class="search-container" onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Mostrar Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
      </div>
    </nav>
    <!-- Filtros avançados -->
    <div id="advancedFilters" style="display: none;">
      <p>Categorias:</p>
      <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
      <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
      <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
      <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
      <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
      <!-- Outros filtros opcionais (como autor e data) -->
      <input type="date" id="startDate" name="startDate" placeholder="Data de início">
      <input type="date" id="endDate" name="endDate" placeholder="Data de fim">
    </div>
    <div id="searchResults"></div>
    <div class="container" id="post-content">
      <img src="/imagens/uploads/${data.image_path}" alt="${data.title}" loading="lazy">
      <!-- Conteúdo do post será carregado aqui -->
    </div>
    <!-- Botão de Voltar -->
    <div class="back-button-container">
      <button onclick="goBack()">Voltar</button>
    </div>
    <script src="search.js"></script>
    <script>
function fetchPost() {
    // Captura o ID do post da URL
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    if (!postId || postId === "undefined") {
        document.getElementById('post-content').innerHTML = '<p>Post não encontrado.</p>';
        console.error('ID do post está ausente ou inválido na URL.');
        return;
    }

    // Busca o post pelo ID
    fetch(`${API_BASE}/post/${postId}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Post não encontrado');
            }
            return response.json();
        })
        .then(data => {
            console.log(data); // Debug para conferir os dados no console

            const postContainer = document.getElementById('post-content');

            // Formatar a data de publicação
            const publishDate = new Date(data.publish_date).toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });

            // Verifica se há uma imagem para exibir
            const imageHTML = data.image_path
                ? `<img src="/imagens/uploads/${data.image_path}" alt="${data.title}" style="max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px;">`
                : '';

            // Exibir categorias corretamente
            const categoriesHTML = data.categories && data.categories.length > 0
                ? data.categories.join(', ')
                : 'Sem categoria';

            postContainer.innerHTML = `
                <h2>${data.title}</h2>
                ${imageHTML}
                <div class="content-body">${data.content}</div>
                <p><strong>Publicado em:</strong> ${publishDate}</p>
                <p><strong>Categorias:</strong> ${categoriesHTML}</p>
            `;
        })
        .catch(error => {
            console.error('Erro ao buscar post:', error);
            document.getElementById('post-content').innerHTML = '<p>Erro ao carregar a postagem.</p>';
        });
}


      function goBack() {
          window.history.back();
      }
      
      // Chama a função ao carregar a página
      window.onload = fetchPost;
    </script>
    <div id="bottom-image"></div>
    <!-- Isso substitui a tag img -->
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
