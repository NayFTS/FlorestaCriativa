<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Criativa - Publicar Post</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/36.0.1/classic/ckeditor.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header">
      </a>
      <h1>Publicar Post</h1>
    </header>
    <div id="top-image"></div>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <a href="#" id="logoutButton">Sair</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <div class="search-overlay-box-header">
          <span style="font-weight:600;font-size:1em;">Pesquisar</span>
          <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        </div>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>
    <form id="postForm" method="post" enctype="multipart/form-data">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" required><br><br>

      <label for="editor">Conteúdo:</label>
      <textarea id="editor" aria-label="Editor de texto do post"></textarea>
      <textarea id="content" name="content" style="display:none;"></textarea>
      <br><br>

      <label for="image">Imagem de Capa:</label>
      <input type="file" id="image" name="image" accept="image/*"><br>
      <img id="previewImage" class="image-preview" alt="Preview da imagem">
      <br>

      <label style="margin-top:12px">Galeria de imagens <span style="font-weight:400;font-size:0.9em">(opcional — até 10 fotos)</span></label>
      <input type="file" id="galleryInput" name="gallery" accept="image/*" multiple>
      <div id="galleryPreview" class="gallery-preview-edit"></div>
      <br>

      <label for="url">Página de destino:</label>
      <select id="url" name="url" required>
        <option value="">escolha uma das opções</option>
        <option value="verde-inspiracao.html">Hobbies, animes, jogos e leituras</option>
        <option value="sapo-imaginario.html">portfolio e projetos</option>
        <option value="rascunhos-da-floresta.html">eu que escrevi</option>
      </select>

      <div id="projectFields" style="display:none">
        <label for="external_link">Link do Repositório <span style="font-weight:400;font-size:0.9em">(opcional — GitHub, etc.)</span></label>
        <input type="url" id="external_link" name="external_link" placeholder="https://github.com/...">
        <label for="preview_link" style="margin-top:12px">Link do Preview <span style="font-weight:400;font-size:0.9em">(opcional — site ao vivo)</span></label>
        <input type="url" id="preview_link" name="preview_link" placeholder="https://meu-projeto.vercel.app">
        <label style="margin-top:12px">Tecnologias <span style="font-weight:400;font-size:0.9em">(opcional — Enter ou vírgula para adicionar)</span></label>
        <input type="text" id="techInput" class="tech-input" placeholder="ex: Node.js, React...">
        <div id="techTagsList" class="tech-tags-editable"></div>
        <input type="hidden" id="technologiesData" name="technologies" value="[]">
      </div>
      <br>

      <fieldset>
        <legend>Categorias:</legend>
        <div class="category">
          <input type="checkbox" id="cat1" value="Escrita" name="category[]">
          <label for="cat1">Escrita</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat2" value="Projetos" name="category[]">
          <label for="cat2">Projetos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat3" value="Animes" name="category[]">
          <label for="cat3">Animes</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat4" value="Jogos" name="category[]">
          <label for="cat4">Jogos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat5" value="Slice of Life" name="category[]">
          <label for="cat5">Slice of Life</label>
        </div>
      </fieldset><br><br>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="submit" id="publishBtn">Publicar</button>
        <button type="button" id="draftBtn">Salvar como rascunho</button>
      </div>
    </form>
    <p id="errorMessage"></p>

    <script>
  let submitStatus = 'published';

  function setupEditor(getContent) {
      document.getElementById('draftBtn').addEventListener('click', function() {
          submitStatus = 'draft';
          document.getElementById('postForm').requestSubmit();
      });

      document.getElementById('image').addEventListener('change', function(event) {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                  const preview = document.getElementById('previewImage');
                  preview.src = e.target.result;
                  preview.style.display = 'block';
              };
              reader.readAsDataURL(file);
          }
      });

      document.getElementById('galleryInput').addEventListener('change', function() {
          const container = document.getElementById('galleryPreview');
          container.innerHTML = '';
          Array.from(this.files).forEach(file => {
              const reader = new FileReader();
              reader.onload = e => {
                  const img = document.createElement('img');
                  img.src = e.target.result;
                  img.className = 'gallery-preview-thumb';
                  container.appendChild(img);
              };
              reader.readAsDataURL(file);
          });
      });

      document.getElementById('postForm').addEventListener('submit', function(event) {
          event.preventDefault();

          document.getElementById('content').value = getContent();
          const formData = new FormData(this);
          const selectedCategories = Array.from(document.querySelectorAll('input[name="category[]"]:checked'))
              .map(checkbox => checkbox.value);
          formData.append('categories', JSON.stringify(selectedCategories));
          formData.append('status', submitStatus);

          const btn = document.querySelector('#postForm button[type="submit"]');
          const errorMsg = document.getElementById('errorMessage');
          btn.disabled = true;
          btn.textContent = 'Publicando...';
          errorMsg.textContent = '';

          fetch(`${API_BASE}/addPost`, {
              method: 'POST',
              body: formData,
              credentials: 'include'
          })
          .then(response => {
              if (!response.ok) {
                  return response.text().then(text => {
                      let msg = text;
                      try { msg = JSON.parse(text).message || text; } catch (_) {}
                      throw new Error(`HTTP ${response.status}: ${msg}`);
                  });
              }
              return response.json();
          })
          .then(data => {
              if (data.success) {
                  submitStatus = 'published';
                  window.location.href = 'managePosts.html';
              } else {
                  errorMsg.textContent = `Erro: ${data.message}`;
                  btn.disabled = false;
                  btn.textContent = 'Publicar';
              }
          })
          .catch(error => {
              console.error('Erro ao enviar o formulário:', error);
              errorMsg.textContent = error.message || 'Erro de rede. Tente novamente.';
              btn.disabled = false;
              btn.textContent = 'Publicar';
          });
      });
  }

  // Project fields toggle
  document.getElementById('url').addEventListener('change', function() {
      document.getElementById('projectFields').style.display =
          this.value === 'sapo-imaginario.html' ? 'block' : 'none';
  });

  // Tech tag input
  let techList = [];

  document.getElementById('techInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = this.value.trim();
          if (val && !techList.includes(val)) {
              techList.push(val);
              renderTechTags();
          }
          this.value = '';
      }
  });

  function removeTech(i) {
      techList.splice(i, 1);
      renderTechTags();
  }

  function renderTechTags() {
      document.getElementById('technologiesData').value = JSON.stringify(techList);
      document.getElementById('techTagsList').innerHTML = techList.map((t, idx) =>
          `<span class="tech-tag">${t}<button type="button" class="tech-tag-remove" onclick="removeTech(${idx})" aria-label="Remover">×</button></span>`
      ).join('');
  }

  try {
      ClassicEditor
          .create(document.querySelector('#editor'), {
              toolbar: {
                  items: [
                      'heading', '|',
                      'bold', 'italic', '|',
                      'link', 'blockQuote', '|',
                      'bulletedList', 'numberedList', '|',
                      'undo', 'redo'
                  ]
              }
          })
          .then(editor => {
              setupEditor(() => editor.getData());
          })
          .catch(error => {
              console.error('Erro ao inicializar o CKEditor:', error);
              const ta = document.getElementById('editor');
              ta.style.display = 'block';
              setupEditor(() => ta.value);
          });
  } catch (error) {
      console.error('CKEditor não disponível:', error);
      const ta = document.getElementById('editor');
      ta.style.display = 'block';
      setupEditor(() => ta.value);
  }


  document.getElementById('logoutButton').addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/api/logout').then(r => { if(r.ok) window.location.href='login.html'; });
  });
  window.onload = function() {
      fetch(`${API_BASE}/user-info`, { credentials: 'include' })
          .then(response => {
              if (!response.ok) {
                  alert('Você precisa estar logada para publicar um post.');
                  window.location.href = 'login.html';
              }
          })
          .catch(error => console.error('Erro ao verificar autenticação:', error));
  };
    </script>

    <div id="bottom-image"></div>
    <script src="search.js"></script>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa &copy; 2026</p>
      </div>
    </footer>
  </body>
</html>
