<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
    </header>

    <div id="top-image"></div>

    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <a href="#" id="logoutButton">Sair</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <div class="search-overlay-box-header">
          <span style="font-weight:600;font-size:1em;">Pesquisar</span>
          <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        </div>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>

    <div class="dashboard-container">
      <h2 id="welcomeMessage">Bem-vindo!</h2>

      <div class="dashboard-actions">
        <button onclick="window.location.href='publicar.html'">Nova Postagem</button>
        <button onclick="window.location.href='managePosts.html'">Gerenciar Postagens</button>
      </div>

      <div class="dashboard-stats" id="statsContainer">
        <h3>Suas Estatísticas:</h3>
        <p>Carregando...</p>
      </div>
    </div>

    <div class="dashboard-recent-posts">
      <h3>Postagens Recentes:</h3>
      <div id="recentPosts"></div>
    </div>

    <div class="dashboard-recent-posts" id="pendingCommentsWrap" style="display:none">
      <h3>Comentários pendentes <span id="pendingCommentCount" class="badge badge-draft"></span></h3>
      <div id="pendingComments"></div>
    </div>

    <script>
  var API_BASE = '/api';

  function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  fetch(`${API_BASE}/user-info`)
      .then(response => {
          if (!response.ok) {
              window.location.href = 'login.html';
              throw new Error('Não autenticado');
          }
          return response.json();
      })
      .then(data => {
          if (data && data.username) {
              document.getElementById('welcomeMessage').textContent = `Bem-vindo, ${data.username}!`;
              document.getElementById('loginButton').textContent = 'Perfil';
              document.getElementById('loginButton').href = 'dashboard.html';
          }
      })
      .catch(error => console.error('Erro ao verificar autenticação:', error));

  document.getElementById('logoutButton').addEventListener('click', function(event) {
      event.preventDefault();
      fetch(`${API_BASE}/logout`)
          .then(response => {
              if (response.ok) window.location.href = 'login.html';
          })
          .catch(error => console.error('Erro ao fazer logout:', error));
  });

  fetch(`${API_BASE}/dashboard-stats`)
      .then(response => response.json())
      .then(data => {
          document.getElementById('statsContainer').innerHTML = `
              <h3>Suas Estatísticas:</h3>
              <p>Total de Postagens: ${data.totalPosts} (${data.publishedCount || 0} publicadas · ${data.draftCount || 0} rascunhos)</p>
              <p>Total de Visualizações: ${data.totalViews || 0}</p>
              <p>Post mais visualizado: "${data.mostPopularPost}"</p>
          `;

          const container = document.getElementById('recentPosts');
          container.innerHTML = '';
          if (!data.recentPosts || data.recentPosts.length === 0) {
              container.innerHTML = '<p>Nenhuma postagem recente.</p>';
          } else {
              data.recentPosts.forEach(post => {
                  const isDraft = post.status === 'draft';
                  const link = post.slug ? `post.html?slug=${post.slug}` : `post.html?id=${post._id}`;
                  const temp = document.createElement('div');
                  temp.innerHTML = post.content;
                  const excerpt = (temp.textContent || '').trim().substring(0, 100);
                  const el = document.createElement('div');
                  el.className = 'recent-post-item';
                  el.innerHTML = `
                      <h4>${post.title} ${isDraft ? '<span class="badge badge-draft">Rascunho</span>' : ''}</h4>
                      <p>${excerpt}...</p>
                      ${isDraft ? '' : `<a href="${link}">Ler mais</a>`}
                  `;
                  container.appendChild(el);
              });
          }
      })
      .catch(error => console.error('Erro ao carregar estatísticas:', error));

  // ── Moderação de comentários ───────────────────────────
  function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(String(str)));
      return div.innerHTML;
  }

  function loadPendingComments() {
      fetch(`${API_BASE}/admin/comments/pending`)
          .then(r => r.json())
          .then(comments => {
              if (!comments.length) return;
              const wrap = document.getElementById('pendingCommentsWrap');
              wrap.style.display = 'block';
              document.getElementById('pendingCommentCount').textContent = comments.length;
              const container = document.getElementById('pendingComments');
              container.innerHTML = '';
              comments.forEach(c => {
                  const date = new Date(c.createdAt).toLocaleDateString('pt-BR', {
                      day: '2-digit', month: 'short', year: 'numeric'
                  });
                  const postTitle = c.post ? escapeHtml(c.post.title) : 'Post removido';
                  const postLink = c.post
                      ? (c.post.slug ? `post.html?slug=${c.post.slug}` : `post.html?id=${c.post._id}`)
                      : '#';
                  const el = document.createElement('div');
                  el.className = 'pending-comment-item';
                  el.dataset.id = c._id;
                  el.innerHTML = `
                      <div class="pending-comment-meta">
                          <strong>${escapeHtml(c.author)}</strong>
                          <time>${date}</time>
                          <span>em <a href="${postLink}">${postTitle}</a></span>
                      </div>
                      <p class="pending-comment-body">${escapeHtml(c.content)}</p>
                      <div class="pending-comment-actions">
                          <button class="btn-approve" onclick="approveComment('${c._id}', this)">Aprovar</button>
                          <button class="btn-reject" onclick="rejectComment('${c._id}', this)">Rejeitar</button>
                      </div>
                  `;
                  container.appendChild(el);
              });
          })
          .catch(() => {});
  }

  function approveComment(id, btn) {
      btn.disabled = true;
      fetch(`${API_BASE}/admin/comments/${id}/approve`, { method: 'PATCH' })
          .then(r => r.json())
          .then(data => {
              if (data.success) removeCommentCard(id);
          })
          .catch(() => { btn.disabled = false; });
  }

  function rejectComment(id, btn) {
      btn.disabled = true;
      fetch(`${API_BASE}/admin/comments/${id}`, { method: 'DELETE' })
          .then(r => r.json())
          .then(data => {
              if (data.success) removeCommentCard(id);
          })
          .catch(() => { btn.disabled = false; });
  }

  function removeCommentCard(id) {
      const el = document.querySelector(`.pending-comment-item[data-id="${id}"]`);
      if (el) el.remove();
      const remaining = document.querySelectorAll('.pending-comment-item').length;
      if (!remaining) {
          document.getElementById('pendingCommentsWrap').style.display = 'none';
      } else {
          document.getElementById('pendingCommentCount').textContent = remaining;
      }
  }

  loadPendingComments();
    </script>

    <div id="bottom-image"></div>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa &copy; 2026</p>
      </div>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
