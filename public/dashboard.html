<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
    </header>

    <div id="top-image"></div>

    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">Sobre Mim</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <a href="#" id="logoutButton">Sair</a>
      </div>
    </nav>

    <div class="dashboard-container">
      <h2 id="welcomeMessage">Bem-vindo!</h2>

      <div class="dashboard-actions">
        <button onclick="window.location.href='publicar.html'">Nova Postagem</button>
        <button onclick="window.location.href='managePosts.html'">Gerenciar Postagens</button>
      </div>

      <div class="dashboard-stats" id="statsContainer">
        <h3>Suas Estatísticas:</h3>
        <p>Carregando...</p>
      </div>
    </div>

    <div class="dashboard-recent-posts">
      <h3>Postagens Recentes:</h3>
      <div id="recentPosts"></div>
    </div>

    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

  function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  fetch(`${API_BASE}/user-info`)
      .then(response => {
          if (!response.ok) {
              window.location.href = 'login.html';
              throw new Error('Não autenticado');
          }
          return response.json();
      })
      .then(data => {
          if (data && data.username) {
              document.getElementById('welcomeMessage').textContent = `Bem-vindo, ${data.username}!`;
              document.getElementById('loginButton').textContent = 'Perfil';
              document.getElementById('loginButton').href = 'dashboard.html';
          }
      })
      .catch(error => console.error('Erro ao verificar autenticação:', error));

  document.getElementById('logoutButton').addEventListener('click', function(event) {
      event.preventDefault();
      fetch(`${API_BASE}/logout`)
          .then(response => {
              if (response.ok) window.location.href = 'login.html';
          })
          .catch(error => console.error('Erro ao fazer logout:', error));
  });

  fetch(`${API_BASE}/dashboard-stats`)
      .then(response => response.json())
      .then(data => {
          document.getElementById('statsContainer').innerHTML = `
              <h3>Suas Estatísticas:</h3>
              <p>Total de Postagens: ${data.totalPosts} (${data.publishedCount || 0} publicadas · ${data.draftCount || 0} rascunhos)</p>
              <p>Total de Visualizações: ${data.totalViews || 0}</p>
              <p>Post mais visualizado: "${data.mostPopularPost}"</p>
          `;

          const container = document.getElementById('recentPosts');
          container.innerHTML = '';
          if (!data.recentPosts || data.recentPosts.length === 0) {
              container.innerHTML = '<p>Nenhuma postagem recente.</p>';
          } else {
              data.recentPosts.forEach(post => {
                  const isDraft = post.status === 'draft';
                  const link = post.slug ? `post.html?slug=${post.slug}` : `post.html?id=${post._id}`;
                  const temp = document.createElement('div');
                  temp.innerHTML = post.content;
                  const excerpt = (temp.textContent || '').trim().substring(0, 100);
                  const el = document.createElement('div');
                  el.className = 'recent-post-item';
                  el.innerHTML = `
                      <h4>${post.title} ${isDraft ? '<span class="badge badge-draft">Rascunho</span>' : ''}</h4>
                      <p>${excerpt}...</p>
                      ${isDraft ? '' : `<a href="${link}">Ler mais</a>`}
                  `;
                  container.appendChild(el);
              });
          }
      })
      .catch(error => console.error('Erro ao carregar estatísticas:', error));
    </script>

    <footer>
      <div class="footer-content">
        <p>Floresta Criativa © 2024–2026 Nay</p>
        <div class="footer-links">
          <a href="https://github.com/nayfts" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
