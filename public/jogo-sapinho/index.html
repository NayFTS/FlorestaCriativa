<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo do Sapinho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="game">
    <div class="hud">
      <span class="hud-item">
        <img class="hud-fly-icon" id="hudFlyIcon" src="assets/mosca.png" alt="">
        <strong id="score">0</strong>
      </span>
      <span class="hud-item" id="hudTimer">⏱ 60</span>
    </div>

    <div class="sky" id="sky"></div>

    <div class="frog" id="frog">
      <div class="tongue" id="tongue"></div>
      <!-- Espera assets/sapo-idle.png (PNG transparente, canvas quadrado); cai pro emoji se o arquivo não existir -->
      <img class="frog-body" id="frogBody" src="assets/sapo-idle.png" alt="Sapinho">
    </div>

    <div class="overlay" id="startOverlay">
      <div class="overlay-card">
        <div class="overlay-banner overlay-banner--start" role="img" aria-label="Game Start"></div>
        <p>Pegue o máximo de moscas que conseguir em 60 segundos!</p>
        <button type="button" class="overlay-btn" id="startBtn">Começar</button>
      </div>
    </div>

    <div class="overlay" id="gameOverOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-banner overlay-banner--gameover" role="img" aria-label="Game Over"></div>
        <p>Você pegou <strong id="finalScore">0</strong> moscas 🪰</p>
        <button type="button" class="overlay-btn" id="restartBtn">Jogar de novo</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
