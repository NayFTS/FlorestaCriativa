<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Criativa - Editar Post</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/36.0.1/classic/ckeditor.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header">
      </a>
      <h1>Editar Post</h1>
    </header>
    <div id="top-image"></div>

    <!-- Formulário de edição -->
    <form id="editPostForm" enctype="multipart/form-data">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" required><br><br>

      <!-- Editor de conteúdo -->
      <label for="editor">Conteúdo:</label>
      <textarea id="editor" aria-label="Editor de texto do post"></textarea>

      <!-- Campo escondido para armazenar o conteúdo final -->
      <textarea id="content" name="content" style="display:none;"></textarea><br><br>

      <label for="image">Imagem de Capa:</label>
      <input type="file" id="image" name="image" accept="image/*"><br><br>
      <!-- Preview da Imagem Atual -->
      <img id="previewImage" src="" alt="Preview da Imagem" style="display: none; max-width: 200px; margin-top: 10px;">


      <label for="url">Página de destino:</label>
      <select id="url" name="url" required>
        <option label="escolha uma das opções"></option>
        <option value="about.html">Sobre Mim</option>
        <option value="verde-inspiracao.html">Hobbies, animes, jogos e leituras</option>
        <option value="sapo-imaginario.html">portfolio e projetos</option>
        <option value="rascunhos-da-floresta.html">eu que escrevi</option>
      </select><br><br>

      <!-- Categorias -->
      <fieldset>
        <legend>Categorias:</legend>
        <div class="category">
          <input type="checkbox" id="cat1" value="1" name="category[]">
          <label for="cat1">Escrita</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat2" value="2" name="category[]">
          <label for="cat2">Projetos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat3" value="3" name="category[]">
          <label for="cat3">Animes</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat4" value="4" name="category[]">
          <label for="cat4">Jogos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat5" value="5" name="category[]">
          <label for="cat5">Slice of Life</label>
        </div>
      </fieldset><br><br>

      <button type="submit">Salvar Alterações</button>
    </form>

    <!-- CKEditor Script -->
    <script>
let editorInstance;
let postId = new URLSearchParams(window.location.search).get('id');

// 🔹 Limpa espaços extras e verifica o ID
postId = postId ? postId.trim() : null;

console.log("ID Capturado:", `"${postId}"`); // 🔹 Verifique se agora está correto

if (!postId || postId === "null" || postId === "undefined" || postId.length !== 24) {
    alert('ID de post inválido.');
    window.location.href = 'managePosts.html';
    throw new Error('ID do post não encontrado ou inválido');
}

      function fetchPost() {
          if (!postId) {
              alert('ID de post inválido.');
              window.location.href = 'managePosts.html';
              return;
          }
    
          fetch(`/post/${postId}`)
          .then(response => {
              if (!response.ok) {
                  throw new Error('Post não encontrado');
              }
              return response.json();
          })
          .then(data => {
              document.getElementById('title').value = data.title;
              document.getElementById('url').value = data.url;
    
              // Inicializa o editor com o conteúdo do post
              ClassicEditor
                  .create(document.querySelector('#editor'))
                  .then(editor => {
                      editorInstance = editor;
                      editorInstance.setData(data.content);
                  })
                  .catch(error => console.error('Erro ao inicializar o CKEditor:', error));
    
              // Exibir preview da imagem atual (se existir)
              if (data.image_path) {
                  const previewImage = document.getElementById('previewImage');
                  previewImage.src = `/imagens/uploads/${data.image_path}`;
                  previewImage.style.display = 'block';
              }
    
              // Marcar as categorias já selecionadas
              if (data.categories) {
                  data.categories.forEach(category => {
                      const checkbox = document.querySelector(`input[name="category[]"][value="${category}"]`);
                      if (checkbox) checkbox.checked = true;
                  });
              }
          })
          .catch(error => {
              console.error('Erro ao carregar o post:', error);
              alert('Erro ao carregar a postagem. Redirecionando para Gerenciar Postagens.');
              window.location.href = 'managePosts.html';
          });
      }
    
      window.onload = fetchPost;

      document.getElementById('image').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
              document.getElementById('previewImage').src = e.target.result;
              document.getElementById('previewImage').style.display = 'block';
          };
          reader.readAsDataURL(file);
      }
  });

  document.getElementById('editPostForm').addEventListener('submit', function (event) {
    event.preventDefault();

    // Adicionar o conteúdo do CKEditor ao campo escondido
    document.getElementById('content').value = editorInstance.getData();

    const formData = new FormData(this);

    // Captura categorias selecionadas
    const selectedCategories = Array.from(document.querySelectorAll('input[name="category[]"]:checked'))
        .map(checkbox => checkbox.value);
    formData.append('categories', JSON.stringify(selectedCategories));

    // Envia o postId para o backend
    formData.append('postId', postId);

    fetch(`/editPost/${postId}`, {
        method: 'POST',
        body: formData,
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Post atualizado com sucesso!');
                window.location.href = 'managePosts.html';
            } else {
                alert(`Erro ao atualizar o post: ${data.message}`);
            }
        })
        .catch(error => {
            console.error('Erro ao enviar as alterações:', error);
            alert('Erro ao salvar as alterações do post. Tente novamente.');
        });
});
    </script>
    
    <div id="bottom-image"></div>
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
