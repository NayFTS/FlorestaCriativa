<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Criativa - Editar Post</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/36.0.1/classic/ckeditor.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header">
      </a>
      <h1>Editar Post</h1>
    </header>
    <div id="top-image"></div>

    <!-- Formulário de edição -->
    <form id="editPostForm" enctype="multipart/form-data">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" required><br><br>

      <!-- Editor de conteúdo -->
      <label for="editor">Conteúdo:</label>
      <textarea id="editor" aria-label="Editor de texto do post"></textarea>

      <!-- Campo escondido para armazenar o conteúdo final -->
      <textarea id="content" name="content" style="display:none;"></textarea><br><br>

      <label for="image">Imagem de Capa:</label>
      <input type="file" id="image" name="image" accept="image/*"><br><br>

      <label for="url">Página de destino:</label>
      <select id="url" name="url" required>
        <option label="escolha uma das opções"></option>
        <option value="about.html">Sobre Mim</option>
        <option value="verde-inspiracao.html">Hobbies, animes, jogos e leituras</option>
        <option value="sapo-imaginario.html">portfolio e projetos</option>
        <option value="rascunhos-da-floresta.html">eu que escrevi</option>
      </select><br><br>

      <!-- Categorias -->
      <fieldset>
        <legend>Categorias:</legend>
        <div class="category">
          <input type="checkbox" id="cat1" value="1" name="category[]">
          <label for="cat1">Escrita</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat2" value="2" name="category[]">
          <label for="cat2">Projetos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat3" value="3" name="category[]">
          <label for="cat3">Animes</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat4" value="4" name="category[]">
          <label for="cat4">Jogos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat5" value="5" name="category[]">
          <label for="cat5">Slice of Life</label>
        </div>
      </fieldset><br><br>

      <button type="submit">Salvar Alterações</button>
    </form>

    <!-- CKEditor Script -->
    <script>
      let editorInstance;

      // Inicializar o CKEditor
      ClassicEditor
        .create(document.querySelector('#editor'))
        .then(editor => {
            editorInstance = editor;

            // Captura o conteúdo do CKEditor ao enviar o formulário
            document.getElementById('editPostForm').addEventListener('submit', function(event) {
                event.preventDefault();
                var content = editorInstance.getData(); // Obtém o conteúdo do CKEditor
                document.getElementById('content').value = content; // Insere o conteúdo no textarea escondido
                
                // Cria o objeto FormData com todos os dados do formulário
                const formData = new FormData(this);

                  // Se nenhuma categoria for selecionada, cria um array vazio
                  const categories = Array.from(document.querySelectorAll('input[name="category[]"]:checked')).map(checkbox => checkbox.value);
                  if (categories.length === 0) {
                      formData.append('categories', JSON.stringify([])); // Envia um array vazio
                  } else {
                      formData.append('categories', JSON.stringify(categories)); // Envia as categorias selecionadas
                  }

                // Envia os dados via fetch
                const postId = new URLSearchParams(window.location.search).get('id'); // Obtém o ID do post
                fetch(`/editPost/${postId}`, {
    method: 'POST',
    body: formData,
})
.then(response => {
    if (!response.ok) {
        throw new Error('Erro na resposta do servidor');
    }
    return response.json();
})
.then(data => {
    if (data.success) {
        alert('Post atualizado com sucesso!');
    } else {
        alert('Erro ao atualizar o post.');
    }
})
.catch(error => {
    console.error('Erro ao enviar o formulário:', error);
});

            });
        })
        .catch(error => {
            console.error('Erro ao inicializar o CKEditor:', error);
        });

      // Carregar os dados do post para edição
      const postId = new URLSearchParams(window.location.search).get('id');

      fetch(`/post/${postId}`)
    .then(response => response.json())
    .then(data => {
        document.getElementById('title').value = data.title;
        editorInstance.setData(data.content); // Carregar o conteúdo no CKEditor
        document.getElementById('url').value = data.url;
console.log('oi');
        // Converter a string concatenada em um array
        const categoryArray = data.category_ids ? data.category_ids.split(',') : [];

        // Marcar as categorias associadas ao post
        categoryArray.forEach(categoryId => {
            const checkbox = document.querySelector(`input[name="category[]"][value="${categoryId}"]`);
            if (checkbox) {
                checkbox.checked = true;  // Marca a checkbox se ela existir
            }
        });
    })
    .catch(error => console.error('Erro ao carregar o post:', error));


    </script>

    <div id="bottom-image"></div>
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
