<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Criativa - Editar Post</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/36.0.1/classic/ckeditor.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header">
      </a>
      <h1>Editar Post</h1>
    </header>
    <div id="top-image"></div>

    <form id="editPostForm" enctype="multipart/form-data">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" required><br><br>

      <label for="editor">Conteúdo:</label>
      <textarea id="editor" aria-label="Editor de texto do post"></textarea>
      <textarea id="content" name="content" style="display:none;"></textarea><br><br>

      <label for="image">Imagem de Capa:</label>
      <input type="file" id="image" name="image" accept="image/*"><br>
      <img id="previewImage" class="image-preview" alt="Preview da imagem">
      <br><br>

      <label for="url">Página de destino:</label>
      <select id="url" name="url" required>
        <option label="escolha uma das opções"></option>
        <option value="about.html">Sobre Mim</option>
        <option value="verde-inspiracao.html">Hobbies, animes, jogos e leituras</option>
        <option value="sapo-imaginario.html">portfolio e projetos</option>
        <option value="rascunhos-da-floresta.html">eu que escrevi</option>
      </select><br><br>

      <fieldset>
        <legend>Categorias:</legend>
        <div class="category">
          <input type="checkbox" id="cat1" value="Escrita" name="category[]">
          <label for="cat1">Escrita</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat2" value="Projetos" name="category[]">
          <label for="cat2">Projetos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat3" value="Animes" name="category[]">
          <label for="cat3">Animes</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat4" value="Jogos" name="category[]">
          <label for="cat4">Jogos</label>
        </div>
        <div class="category">
          <input type="checkbox" id="cat5" value="Slice of Life" name="category[]">
          <label for="cat5">Slice of Life</label>
        </div>
      </fieldset><br><br>

      <button type="submit">Salvar Alterações</button>
    </form>
    <p id="errorMessage"></p>

    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

  let editorInstance;
  const postId = (new URLSearchParams(window.location.search).get('id') || '').trim();

  if (!postId || postId === 'null' || postId === 'undefined' || postId.length !== 24) {
      alert('ID de post inválido.');
      window.location.href = 'managePosts.html';
  }

  function fetchPost() {
      fetch(`${API_BASE}/post/${postId}`)
          .then(response => {
              if (!response.ok) throw new Error('Post não encontrado');
              return response.json();
          })
          .then(data => {
              document.getElementById('title').value = data.title;
              document.getElementById('url').value = data.url;

              ClassicEditor
                  .create(document.querySelector('#editor'), {
                      toolbar: {
                          items: [
                              'heading', '|',
                              'bold', 'italic', 'underline', '|',
                              'link', 'blockQuote', '|',
                              'bulletedList', 'numberedList', '|',
                              'undo', 'redo'
                          ]
                      }
                  })
                  .then(editor => {
                      editorInstance = editor;
                      editorInstance.setData(data.content);
                  })
                  .catch(error => console.error('Erro ao inicializar o CKEditor:', error));

              if (data.image_path) {
                  const previewImage = document.getElementById('previewImage');
                  previewImage.src = data.image_path.startsWith('http') ? data.image_path : `/imagens/uploads/${data.image_path}`;
                  previewImage.style.display = 'block';
              }

              if (data.categories) {
                  data.categories.forEach(category => {
                      const checkbox = document.querySelector(`input[name="category[]"][value="${category}"]`);
                      if (checkbox) checkbox.checked = true;
                  });
              }
          })
          .catch(error => {
              console.error('Erro ao carregar o post:', error);
              alert('Erro ao carregar a postagem. Redirecionando...');
              window.location.href = 'managePosts.html';
          });
  }

  document.getElementById('image').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
              const preview = document.getElementById('previewImage');
              preview.src = e.target.result;
              preview.style.display = 'block';
          };
          reader.readAsDataURL(file);
      }
  });

  document.getElementById('editPostForm').addEventListener('submit', function(event) {
      event.preventDefault();

      document.getElementById('content').value = editorInstance.getData();
      const formData = new FormData(this);
      const selectedCategories = Array.from(document.querySelectorAll('input[name="category[]"]:checked'))
          .map(checkbox => checkbox.value);
      formData.append('categories', JSON.stringify(selectedCategories));
      formData.append('postId', postId);

      const btn = document.querySelector('#editPostForm button[type="submit"]');
      const errorMsg = document.getElementById('errorMessage');
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      errorMsg.textContent = '';

      fetch(`${API_BASE}/editPost/${postId}`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
      })
      .then(response => response.json())
      .then(data => {
          if (data.success) {
              window.location.href = 'managePosts.html';
          } else {
              errorMsg.textContent = `Erro: ${data.message}`;
              btn.disabled = false;
              btn.textContent = 'Salvar Alterações';
          }
      })
      .catch(error => {
          console.error('Erro ao enviar as alterações:', error);
          errorMsg.textContent = 'Erro de rede. Tente novamente.';
          btn.disabled = false;
          btn.textContent = 'Salvar Alterações';
      });
  });

  window.onload = function() {
      fetch(`${API_BASE}/user-info`)
          .then(response => {
              if (!response.ok) {
                  alert('Você precisa estar logada para editar um post.');
                  window.location.href = 'login.html';
                  return;
              }
              fetchPost();
          })
          .catch(error => console.error('Erro ao verificar autenticação:', error));
  };
    </script>

    <div id="bottom-image"></div>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa © 2024–2026 Nay</p>
        <div class="footer-links">
          <a href="https://github.com/nayfts" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
