<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetar Senha - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Resetar Senha</p>
    </header>

    <div class="login-container">
      <h2>Resetar Senha</h2>
      <form id="resetForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="secret">Chave secreta:</label>
        <input type="password" id="secret" name="secret" required>

        <label for="newPassword">Nova senha:</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="6">

        <button type="submit" id="submitBtn">Redefinir senha</button>
        <p><a href="login.html">Voltar ao login</a></p>
      </form>
      <p id="errorMessage" style="color: red;"></p>
      <p id="successMessage" style="color: green;"></p>
    </div>

    <script>
      const API_BASE = location.hostname === 'localhost' ? '' : '/api';

      document.getElementById('resetForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const secret = document.getElementById('secret').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');
        const btn = document.getElementById('submitBtn');

        errorEl.innerHTML = '';
        successEl.innerHTML = '';

        if (newPassword.length < 6) {
          errorEl.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Aguarde...';

        try {
          const res = await fetch(`${API_BASE}/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, secret, newPassword })
          });

          const data = await res.json();

          if (!res.ok) {
            if (data.errors) {
              errorEl.innerHTML = data.errors.map(e => `<p>${e.msg}</p>`).join('');
            } else {
              errorEl.innerHTML = `<p>${data.message}</p>`;
            }
          } else {
            successEl.innerHTML = 'Senha redefinida! <a href="login.html">Fazer login</a>';
            document.getElementById('resetForm').reset();
          }
        } catch (err) {
          errorEl.innerHTML = '<p>Erro de conexão. Tente novamente.</p>';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Redefinir senha';
        }
      });
    </script>

    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
