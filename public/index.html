<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Criativa</title>
    <link rel="stylesheet" href="styles.css">
    <!--<link rel="stylesheet" href="dist/styles.css">!-->
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Bem-vindo ao meu espaço de escrita, projetos e inspiração!</p>
    </header>
    <div id="top-image">
    </div>
    <!-- Isso substitui a tag img -->
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <!-- Ícone de hambúrguer -->
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">Sobre Mim</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <!-- Formulário de pesquisa agora está dentro do nav -->
        <form class="search-container" onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Mostrar Filtros</button>
        </form>
        <a href="login.html" id="loginButton">Login</a>
      </div>
    </nav>
    <!-- Filtros avançados -->
    <div id="advancedFilters" style="display: none;">
      <!-- Filtros de categoria com checkboxes -->
      <p>Categorias:</p>
      <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
      <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
      <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
      <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
      <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>      
      <!-- Outros filtros opcionais (como autor e data) -->
      <input type="date" id="startDate" name="startDate">
      <input type="date" id="endDate" name="endDate">
    </div>
    <div id="searchResults"></div>
    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

      function toggleMenu() {
        const menu = document.getElementById('menu');
        if (menu.style.display === 'block') {
          menu.style.display = 'none';
        } else {
          menu.style.display = 'block';
        }
      }
      function toggleFilters() {
            const filters = document.getElementById('advancedFilters');
            if (filters.style.display === "none") {
              filters.style.display = "block";
            } else {
              filters.style.display = "none";
            }
          }
        
          function search() {
            const query = document.getElementById('searchBar').value.trim();
            const selectedCategories = Array.from(document.querySelectorAll('.category:checked')).map(checkbox => checkbox.value);
            const startDate = document.getElementById('startDate').value || '';
            const endDate = document.getElementById('endDate').value || '';

            // Verificação se pelo menos um campo foi preenchido
            if (!query && selectedCategories.length === 0 && !startDate && !endDate) {
                alert("Por favor, preencha ao menos um campo para realizar a pesquisa.");
                return; // Não faz nada se nenhum parâmetro for preenchido
            }

            // Monta a URL da pesquisa com os filtros
            const categoriesString = selectedCategories.join(',');
            const searchURL = `/search?q=${query}&category=${categoriesString}&startDate=${startDate}&endDate=${endDate}`;

            fetch(searchURL)
                .then(response => response.json())
                .then(data => {
                    const resultContainer = document.getElementById('searchResults');
                    resultContainer.innerHTML = '';

                    if (data.length === 0) {
                        resultContainer.style.display = 'block';
                        resultContainer.innerHTML = '<p>Nenhum resultado encontrado.</p>';
                    } else {
                        resultContainer.style.display = 'block';
                        data.forEach(post => {
                            const resultItem = document.createElement('div');
                            resultItem.className = "search-result";

                            // Título do post
                            const titleElement = document.createElement('h3');
                            titleElement.innerHTML = `<a href="post.html?id=${post.id}">${post.title}</a>`;
                            resultItem.appendChild(titleElement);

                            // Exibe as categorias concatenadas
                            const categoryElement = document.createElement('p');
                            categoryElement.innerHTML = `<strong>Categoria(s):</strong> ${post.categories}`;
                            resultItem.appendChild(categoryElement);

                            // Filtrar o trecho do texto e colocar em negrito
                            const regex = new RegExp(query, 'gi');
                            const highlightedText = post.content.replace(regex, match => `<strong>${match}</strong>`);
                            const excerpt = highlightedText.substring(0, 100) + '...';  // Limita o trecho a 100 caracteres

                            const excerptElement = document.createElement('p');
                            excerptElement.innerHTML = excerpt;
                            resultItem.appendChild(excerptElement);

                            resultContainer.appendChild(resultItem);
                        });
                    }
                })
                .catch(error => {
                    console.error('Erro na busca:', error);
                });
      }
      function search() {
    const query = document.getElementById('searchBar').value.trim();
    const selectedCategories = Array.from(document.querySelectorAll('.category:checked')).map(checkbox => checkbox.value);
    const startDate = document.getElementById('startDate').value || '';
    const endDate = document.getElementById('endDate').value || '';

    // Verificação se pelo menos um campo foi preenchido
    if (!query && selectedCategories.length === 0 && !startDate && !endDate) {
        alert("Por favor, preencha ao menos um campo para realizar a pesquisa.");
        return;
    }

    // Monta a URL da pesquisa com os filtros
    const categoriesString = selectedCategories.join(',');
    const searchURL = `/search?q=${query}&category=${categoriesString}&startDate=${startDate}&endDate=${endDate}`;

    fetch(searchURL)
        .then(response => response.json())
        .then(data => {
            const resultContainer = document.getElementById('searchResults');
            resultContainer.innerHTML = '';

            if (data.length === 0) {
                resultContainer.style.display = 'block';
                resultContainer.innerHTML = '<p>Nenhum resultado encontrado.</p>';
            } else {
                resultContainer.style.display = 'block';
                data.forEach(post => {
                    const resultItem = document.createElement('div');
                    resultItem.className = "search-result";

                    // Título do post
                    const titleElement = document.createElement('h3');
                    titleElement.innerHTML = `<a href="post.html?id=${post._id}">${post.title}</a>`;
                    resultItem.appendChild(titleElement);

                    // Exibe as categorias concatenadas
                    if (post.categories && post.categories.length > 0) {
                        const categoryElement = document.createElement('p');
                        categoryElement.innerHTML = `<strong>Categoria(s):</strong> ${post.categories.join(', ')}`;
                        resultItem.appendChild(categoryElement);
                    }

                    // Trecho do conteúdo
                    const excerpt = post.content.substring(0, 100) + '...';
                    const excerptElement = document.createElement('p');
                    excerptElement.innerHTML = excerpt;
                    resultItem.appendChild(excerptElement);

                    resultContainer.appendChild(resultItem);
                });
            }
        })
        .catch(error => {
            console.error('Erro na busca:', error);
        });
}

      // Função para buscar posts recentes e exibi-los nas seções
      function fetchRecentPosts() {
    fetch(`${API_BASE}/recent-posts`)
    .then(response => response.json())
    .then(data => {
        const postsRecentesContainer = document.getElementById('recent-posts-container');
        postsRecentesContainer.innerHTML = ''; // Limpa o conteúdo anterior

        data.forEach(post => {
            const postContent = post.content.length > 100 ? post.content.substring(0, 100) + '...' : post.content;
            const imageUrl = post.image_path ? `/imagens/uploads/${post.image_path}` : 'imagens/quadrado_da_floresta.webp';
            
            const postItem = document.createElement('div');
            postItem.classList.add('post-container');
            postItem.innerHTML = `
                <h3><a href="post.html?id=${post._id}">${post.title}</a></h3>
                <img src="${imageUrl}" alt="${post.title}" loading="lazy">
                <p>${postContent}</p>
                <a href="post.html?id=${post._id}" class="leia-mais">Leia mais</a>
            `;
            postsRecentesContainer.appendChild(postItem);
        });

    })
    .catch(error => {
        console.error('Erro ao buscar posts recentes:', error);
    });
}

      let currentIndex = 0;

function showPost(index) {
    const posts = document.querySelectorAll('.post-container');
    const totalPosts = posts.length;

    // Se o índice for maior que o número de posts, volta para o primeiro
    if (index >= totalPosts) {
        currentIndex = totalPosts - 1;
    }
    // Se o índice for menor que zero, vai para o último post
    if (index < 0) {
        currentIndex = 0;
    }

    // Move o carrossel para o post correspondente
    const carousel = document.querySelector('.carousel');
    carousel.style.transform = `translateX(-${currentIndex * 100}%)`;

    // Atualiza os botões
    updateButtons();
}

function nextPost() {
    currentIndex++;
    showPost(currentIndex);
}

function prevPost() {
    currentIndex--;
    showPost(currentIndex);
}

function updateButtons() {
    const totalPosts = document.querySelectorAll('.post-container').length;

    // Desativa o botão de "anterior" se estiver no primeiro post
    if (currentIndex === 0) {
        document.querySelector('.prev-btn').disabled = true;
    } else {
        document.querySelector('.prev-btn').disabled = false;
    }

    // Desativa o botão de "próximo" se estiver no último post
    if (currentIndex === totalPosts - 1) {
        document.querySelector('.next-btn').disabled = true;
    } else {
        document.querySelector('.next-btn').disabled = false;
    }
}

// Chama a função quando a página é carregada
window.onload = function() {
    fetchRecentPosts();
    updateButtons(); // Chama o controle dos botões ao carregar
};
  // Faz a requisição para verificar se o usuário está autenticado
  fetch('/user-info')
    .then(response => {
      if (!response.ok) {
        document.getElementById('loginButton').textContent = 'Login';
        document.getElementById('loginButton').href = 'login.html';
      } else {
        return response.json();
      }
    })
    .then(data => {
      if (data && data.username) {
        document.getElementById('loginButton').textContent = `Bem-vindo, ${data.username}`;
        document.getElementById('loginButton').href = 'dashboard.html'; // Agora o link leva ao dashboard
      }
    })
    .catch(error => {
      console.error('Erro ao verificar autenticação:', error);
    });
    
    </script>
    <div class="container" id="content">
      <section id="posts-recentes" class="section-container">
        <h2 id="recent-posts-title">Posts Recentes</h2>
        <div class="carousel-container">
          <!-- Botão de navegação à esquerda -->
          <button class="carousel-btn prev-btn" onclick="prevPost()" aria-label="Post Anterior">&#10094;</button>
          <!-- Container dos posts recentes -->
          <div id="recent-posts-container" class="carousel">
            <!-- Aqui seus posts serão inseridos -->
            <div class="post-container">Post 1</div>
            <div class="post-container">Post 2</div>
            <div class="post-container">Post 3</div>
            <div class="post-container">Post 4</div>
            <div class="post-container">Post 5</div>
          </div>
          <!-- Botão de navegação à direita -->
          <button class="carousel-btn next-btn" onclick="nextPost()" aria-label="Próximo Post">&#10095;</button>
        </div>
      </section>
    </div>
    <div id="bottom-image"></div>
    <!-- Isso substitui a tag img -->
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
