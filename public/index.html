<html lang="pt-br">
  <head>

    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <!--<link rel="stylesheet" href="dist/styles.css">!-->
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Bem-vindo ao meu espaço de escrita, projetos e inspiração!</p>
    </header>
    <div id="top-image">
    </div>
    <!-- Isso substitui a tag img -->
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <!-- Ícone de hambúrguer -->
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">Sobre Mim</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>
    <script src="search.js"></script>
    <script>
      let _idx = 0;
      let _posts = [];
      let _timer = null;

      function _build(data) {
          _posts = data;
          const track = document.getElementById('carouselTrack');
          const dots  = document.getElementById('carouselDots');
          track.innerHTML = '';
          dots.innerHTML  = '';

          data.forEach((post, i) => {
              const img  = post.image_path
                  ? (post.image_path.startsWith('http') ? post.image_path : `/imagens/uploads/${post.image_path}`)
                  : 'imagens/quadrado_da_floresta.webp';
              const link = post.slug ? `post.html?slug=${post.slug}` : `post.html?id=${post._id}`;
              const tmp  = document.createElement('div');
              tmp.innerHTML = post.content;
              const text = (tmp.textContent || tmp.innerText || '').trim();
              const excerpt = text.length > 160 ? text.substring(0, 160) + '...' : text;

              const slide = document.createElement('div');
              slide.className = 'carousel-slide';
              slide.innerHTML = `
                  <a href="${link}" class="carousel-card">
                      <div class="carousel-img-wrap">
                          <img src="${img}" alt="${post.title}" loading="${i === 0 ? 'eager' : 'lazy'}">
                      </div>
                      <div class="carousel-card-body">
                          <h3>${post.title}</h3>
                          <p>${excerpt}</p>
                          <span class="leia-mais">Leia mais →</span>
                      </div>
                  </a>`;
              track.appendChild(slide);

              const dot = document.createElement('button');
              dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
              dot.setAttribute('aria-label', `Post ${i + 1}`);
              dot.onclick = () => _go(i);
              dots.appendChild(dot);
          });

          _render();
          _startTimer();

          const wrap = document.getElementById('carouselWrap');
          let sx = 0;
          wrap.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
          wrap.addEventListener('touchend',   e => {
              const d = sx - e.changedTouches[0].clientX;
              if (Math.abs(d) > 40) _go(_idx + (d > 0 ? 1 : -1));
          }, { passive: true });
          wrap.addEventListener('mouseenter', () => clearInterval(_timer));
          wrap.addEventListener('mouseleave', _startTimer);
      }

      function _go(i) {
          _idx = Math.max(0, Math.min(i, _posts.length - 1));
          _render();
          clearInterval(_timer);
          _startTimer();
      }

      function _render() {
          document.getElementById('carouselTrack').style.transform = `translateX(-${_idx * 100}%)`;
          document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === _idx));
          document.getElementById('carouselPrev').disabled = _idx === 0;
          document.getElementById('carouselNext').disabled = _idx === _posts.length - 1;
      }

      function _startTimer() {
          _timer = setInterval(() => _go(_idx < _posts.length - 1 ? _idx + 1 : 0), 5000);
      }

      window.onload = function() {
          fetch(`${API_BASE}/recent-posts`)
              .then(r => r.json())
              .then(_build)
              .catch(() => {
                  document.getElementById('carouselWrap').innerHTML =
                      '<p style="padding:48px;text-align:center;color:var(--color-text-secondary)">Não foi possível carregar os posts.</p>';
              });
      };
    </script>
    <div class="container" id="content">
      <section id="posts-recentes" class="section-container">
        <h2>Posts Recentes</h2>
        <div class="carousel-wrap" id="carouselWrap">
          <div class="carousel-track" id="carouselTrack"></div>
          <button class="carousel-arrow carousel-prev" id="carouselPrev" onclick="_go(_idx - 1)" aria-label="Post anterior">&#8592;</button>
          <button class="carousel-arrow carousel-next" id="carouselNext" onclick="_go(_idx + 1)" aria-label="Próximo post">&#8594;</button>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>
      </section>
    </div>
    <div id="bottom-image"></div>
    <!-- Isso substitui a tag img -->
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa © 2024–2026 Nay</p>
        <div class="footer-links">
          <a href="https://github.com/nayfts" target="_blank" rel="noopener">GitHub</a>
          <a href="/api/feed.xml" target="_blank">RSS</a>
        </div>
      </div>
    </footer>
  </body>
</html>
