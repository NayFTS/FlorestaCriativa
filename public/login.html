<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Floresta Criativa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Área de Login</p>
    </header>

    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
        <p>Não tem uma conta? <a href="register.html" id="registerLink">Cadastre-se aqui</a></p>

      </form>
      <p id="errorMessage" style="color: red;"></p>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
    
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMessageElement = document.getElementById('errorMessage');
    
        // Limpa mensagens anteriores
        errorMessageElement.innerHTML = '';
    
        // Validação no lado do cliente
        if (!email.includes('@') || !email.includes('.')) {
          errorMessageElement.innerHTML = 'Por favor, insira um email válido.';
          return;
        }
        if (password.length < 6) {
          errorMessageElement.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }
    
        // Enviar requisição ao backend
        fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
})
    .then(response => {
        if (!response.ok) {
            return response.json().then(data => { throw data; });
        }
        return response.json();
    })
    .then(data => {
        alert(data.message || 'Login bem-sucedido! Redirecionando para o dashboard...');
        window.location.href = '/dashboard.html';
    })
    .catch(error => {
        console.error('Erro no login:', error);
        if (error.errors) {
            errorMessageElement.innerHTML = error.errors.map(err => `<p>${err.msg}</p>`).join('');
        } else if (error.message) {
            errorMessageElement.innerHTML = `<p>${error.message}</p>`;
        } else {
            errorMessageElement.innerHTML = '<p>Erro desconhecido. Tente novamente.</p>';
        }
    });

      });
    </script>
    
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
