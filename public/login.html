<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Área de Login</p>
    </header>
    <div id="top-image"></div>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <div class="search-overlay-box-header">
          <span style="font-weight:600;font-size:1em;">Pesquisar</span>
          <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        </div>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
        <p><a href="reset-password.html">Esqueci minha senha</a></p>

      </form>
      <p id="errorMessage"></p>
    </div>

    <script>
  const API_BASE = '/api';

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const errorMessageElement = document.getElementById('errorMessage');

        // Limpa estado de erro anterior
        errorMessageElement.innerHTML = '';
        emailInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');

        // Validação no lado do cliente
        if (!email.includes('@') || !email.includes('.')) {
          emailInput.classList.add('input-error');
          errorMessageElement.innerHTML = 'Por favor, insira um email válido.';
          return;
        }
        if (password.length < 6) {
          passwordInput.classList.add('input-error');
          errorMessageElement.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }

        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(data => { throw data; });
            }
            return response.json();
        })
        .then(() => {
            window.location.href = '/dashboard.html';
        })
        .catch(error => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
            emailInput.classList.add('input-error');
            passwordInput.classList.add('input-error');
            if (error.errors) {
                errorMessageElement.innerHTML = error.errors.map(err => `<p>${err.msg}</p>`).join('');
            } else if (error.message) {
                errorMessageElement.innerHTML = `<p>${error.message}</p>`;
            } else {
                errorMessageElement.innerHTML = '<p>Erro desconhecido. Tente novamente.</p>';
            }
        });

      });
    </script>
    
    <script src="search.js"></script>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa &copy; 2026</p>
      </div>
    </footer>
  </body>
</html>
