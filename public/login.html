<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Área de Login</p>
    </header>

    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
        <p><a href="reset-password.html">Esqueci minha senha</a></p>

      </form>
      <p id="errorMessage" style="color: red;"></p>
    </div>

    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const errorMessageElement = document.getElementById('errorMessage');

        // Limpa estado de erro anterior
        errorMessageElement.innerHTML = '';
        emailInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');

        // Validação no lado do cliente
        if (!email.includes('@') || !email.includes('.')) {
          emailInput.classList.add('input-error');
          errorMessageElement.innerHTML = 'Por favor, insira um email válido.';
          return;
        }
        if (password.length < 6) {
          passwordInput.classList.add('input-error');
          errorMessageElement.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }

        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(data => { throw data; });
            }
            return response.json();
        })
        .then(() => {
            window.location.href = '/dashboard.html';
        })
        .catch(error => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
            emailInput.classList.add('input-error');
            passwordInput.classList.add('input-error');
            if (error.errors) {
                errorMessageElement.innerHTML = error.errors.map(err => `<p>${err.msg}</p>`).join('');
            } else if (error.message) {
                errorMessageElement.innerHTML = `<p>${error.message}</p>`;
            } else {
                errorMessageElement.innerHTML = '<p>Erro desconhecido. Tente novamente.</p>';
            }
        });

      });
    </script>
    
    <script src="search.js"></script>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa © 2024–2026 Nay</p>
        <div class="footer-links">
          <a href="https://github.com/nayfts" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
