<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
      <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Área de Registro</p>
    </header>

    <div class="register-container">
      <h2>Registro</h2>
      <form id="registerForm">
        <label for="username">Nome de Usuário:</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Registrar</button>
      </form>
      <p id="errorMessage" style="color: red;"></p>
    </div>

    <script>
  const API_BASE = location.hostname === 'localhost' ? '' : '/api';

      document.getElementById('registerForm').addEventListener('submit', function(event) {
        event.preventDefault();
    
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMessageElement = document.getElementById('errorMessage');
    
        // Limpar mensagens anteriores
        errorMessageElement.innerHTML = '';
    
        // Validação no lado do cliente antes de enviar
        if (username.length < 3) {
          errorMessageElement.innerHTML = 'Nome de usuário deve ter pelo menos 3 caracteres.';
          return;
        }
        if (!email.includes('@') || !email.includes('.')) {
          errorMessageElement.innerHTML = 'Por favor, insira um email válido.';
          return;
        }
        if (password.length < 6) {
          errorMessageElement.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }
    
        // Enviar a requisição para o backend
        fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        })
        .then(response => response.json())
        .then(data => {
          if (data.errors) {
            // Exibir múltiplos erros se houver
            errorMessageElement.innerHTML = data.errors.map(err => `<p>${err.msg}</p>`).join('');
          } else {
            alert('Registro bem-sucedido! Redirecionando para a tela de login...');
            window.location.href = '/login';
          }
        })
        .catch(error => {
          console.error('Erro no registro:', error);
          errorMessageElement.innerHTML = 'Ocorreu um erro inesperado. Tente novamente.';
        });
      });
    </script>
    
    <footer>
      <p>Floresta Criativa © 2024 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
