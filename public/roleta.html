<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de Sorteio</title>
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        
        .container {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .roleta-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .roleta {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #c5c4c4;
            transform-origin: center;
        }
        .ponteiro {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%) rotate(270deg);
            width: 20px;
            height: 40px;
            background-color: grey;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 10;
        }
        .centro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            z-index: 5;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        textarea {
            width: 250px;
            height: 150px;
            margin-bottom: 20px;
            resize: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            z-index: 1000;
            text-align: center;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .modal button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="roleta-container">
            <div class="ponteiro"></div>
            <canvas id="roleta" class="roleta"></canvas>
            <div class="centro"></div>
        </div>
        <div class="input-container">
            <textarea id="inputItens" placeholder="Digite os itens, separados por ENTER" oninput="atualizarRoleta()"></textarea>
            <button onclick="sortear()">Sortear</button>
        </div>
    </div>

    <div class="modal-overlay" onclick="fecharModal()"></div>
    <div class="modal" id="modalResultado">
        <p id="resultadoTexto"></p>
        <button onclick="fecharModal()">Fechar</button>
    </div>

    <script>
        let anguloAtual = 0;
        let velocidadeInicial = 50;
        let desaceleracao = 0.98;

        document.addEventListener("DOMContentLoaded", () => {
            const savedItems = localStorage.getItem("roletaItens");
            if (savedItems) {
                document.getElementById("inputItens").value = savedItems;
                atualizarRoleta();
            }
        });

        function desenharRoleta(itens) {
            const canvas = document.getElementById("roleta");
            const ctx = canvas.getContext("2d");
            const numItens = itens.length;
            const angulo = 2 * Math.PI / numItens;
            const cores = ["#f39c12", "#e74c3c", "#8e44ad", "#3498db", "#1abc9c", "#2ecc71", "#e67e22", "#d35400", "#c0392b", "#16a085", "#2980b9"];

            canvas.width = 400;
            canvas.height = 400;

            for (let i = 0; i < numItens; i++) {
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, i * angulo, (i + 1) * angulo);
                ctx.fillStyle = cores[i % cores.length];
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "16px Arial";
                ctx.translate(200, 200);
                ctx.rotate(i * angulo + angulo / 2);
                ctx.fillText(itens[i], 120, 10);
                ctx.rotate(- (i * angulo + angulo / 2));
                ctx.translate(-200, -200);
            }
        }

        function atualizarRoleta() {
            const input = document.getElementById("inputItens").value;
            localStorage.setItem("roletaItens", input);
            const itens = input.split("\n").filter(item => item.trim() !== "");
            desenharRoleta(itens);
        }

        function sortear() {
            const input = document.getElementById("inputItens").value;
            localStorage.setItem("roletaItens", input);
            const itens = input.split("\n").filter(item => item.trim() !== "");
            if (itens.length === 0) return;
            desenharRoleta(itens);
            let roleta = document.getElementById("roleta");
            let velocidade = velocidadeInicial;
            let intervalo = setInterval(() => {
                velocidade *= desaceleracao;
                anguloAtual += velocidade;
                roleta.style.transform = `rotate(${anguloAtual}deg)`;
                if (velocidade < 0.5) {
                    clearInterval(intervalo);
                    let indiceSorteado = Math.floor(((360 - (anguloAtual % 360)) / (360 / itens.length)) % itens.length);
                    document.getElementById("resultadoTexto").innerText = `Item sorteado: ${itens[indiceSorteado]}`;
                    document.querySelector(".modal-overlay").style.display = "block";
                    document.getElementById("modalResultado").style.display = "block";
                }
            }, 30);
        }

        function fecharModal() {
            document.querySelector(".modal-overlay").style.display = "none";
            document.getElementById("modalResultado").style.display = "none";
        }
    </script>
</body>
</html>
