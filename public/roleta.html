<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de Sorteio - Floresta Criativa</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon_io/site.webmanifest">
  </head>
  <body>
    <header>
      <a href="index.html">
        <img id="header-image" src="imagens/nayfts-header-mid.png" alt="NayFTS header" loading="lazy">
      </a>
      <h1>Floresta Criativa</h1>
      <p>Roleta de Sorteio</p>
    </header>
    <div id="top-image"></div>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="verde-inspiracao.html">Verde Inspiração</a>
        <a href="sapo-imaginario.html">Sapo Imaginário</a>
        <a href="rascunhos-da-floresta.html">Rascunhos da Floresta</a>
        <a href="login.html" id="loginButton">Login</a>
        <button id="searchToggle" class="icon-btn" aria-label="Abrir busca" onclick="toggleSearch()">🔍</button>
      </div>
    </nav>
    <div id="searchOverlay" class="search-overlay" onclick="closeSearchOverlay(event)" style="display:none;">
      <div class="search-overlay-box">
        <div class="search-overlay-box-header">
          <span style="font-weight:600;font-size:1em;">Pesquisar</span>
          <button class="icon-btn search-close-btn" onclick="toggleSearch()" aria-label="Fechar">✕</button>
        </div>
        <form onsubmit="search(); return false;">
          <input type="text" id="searchBar" name="searchBar" placeholder="Pesquise por termos...">
          <button type="submit">Pesquisar</button>
          <button type="button" onclick="toggleFilters()">Filtros</button>
          <button type="button" onclick="clearSearch()">Limpar</button>
        </form>
        <div id="advancedFilters" style="display:none;">
          <p>Categorias:</p>
          <label><input type="checkbox" class="category" value="Escrita" name="category[]"> Escrita</label>
          <label><input type="checkbox" class="category" value="Projetos" name="category[]"> Projetos</label>
          <label><input type="checkbox" class="category" value="Animes" name="category[]"> Animes</label>
          <label><input type="checkbox" class="category" value="Jogos" name="category[]"> Jogos</label>
          <label><input type="checkbox" class="category" value="Slice of Life" name="category[]"> Slice of Life</label>
          <input type="date" id="startDate" name="startDate">
          <input type="date" id="endDate" name="endDate">
        </div>
        <div id="searchResults"></div>
      </div>
    </div>

    <div class="container" style="padding: 32px 20px;">
      <div class="roleta-wrapper">
        <div class="roleta-container">
          <div class="ponteiro"></div>
          <canvas id="roleta" class="roleta"></canvas>
          <div class="centro"></div>
        </div>
        <div class="roleta-input-container">
          <label for="inputItens" style="font-weight:600;margin-bottom:8px;display:block;">Itens (um por linha)</label>
          <textarea id="inputItens" placeholder="Digite os itens, separados por ENTER" oninput="atualizarRoleta()"></textarea>
          <button onclick="sortear()">Sortear</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" onclick="fecharModal()"></div>
    <div class="modal" id="modalResultado">
      <p id="resultadoTexto"></p>
      <button onclick="fecharModal()">Fechar</button>
    </div>

    <div id="bottom-image"></div>
    <footer>
      <div class="footer-content">
        <p>Floresta Criativa &copy; 2026</p>
      </div>
    </footer>

    <style>
      .roleta-wrapper {
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 40px;
          flex-wrap: wrap;
      }
      .roleta-container {
          position: relative;
          width: 360px;
          height: 360px;
          flex-shrink: 0;
      }
      .roleta {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background-color: var(--color-border);
          transform-origin: center;
      }
      .ponteiro {
          position: absolute;
          top: 50%;
          left: 100%;
          transform: translate(-50%, -50%) rotate(270deg);
          width: 18px;
          height: 36px;
          background-color: var(--color-accent-dark);
          clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
          z-index: 10;
      }
      .centro {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 64px;
          height: 64px;
          background-color: var(--color-surface);
          border-radius: 50%;
          z-index: 5;
          border: 3px solid var(--color-accent);
      }
      .roleta-input-container {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          width: 260px;
      }
      .roleta-input-container textarea {
          width: 100%;
          height: 160px;
          margin-bottom: 12px;
          resize: vertical;
          border-radius: 8px;
          padding: 10px;
          font-size: 0.95rem;
          font-family: inherit;
          background: var(--color-surface);
          color: var(--color-text);
          border: 1px solid var(--color-border);
          box-sizing: border-box;
      }
      .modal {
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: var(--color-surface);
          color: var(--color-text);
          padding: 28px 32px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.18);
          border-radius: 12px;
          z-index: 1000;
          text-align: center;
          border: 1px solid var(--color-border);
          min-width: 220px;
      }
      .modal p {
          font-size: 1.1rem;
          font-weight: 600;
          margin: 0 0 16px;
      }
      .modal-overlay {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.45);
          z-index: 999;
      }
      @media (max-width: 600px) {
          .roleta-container { width: 280px; height: 280px; }
          .roleta-input-container { width: 100%; }
      }
    </style>

    <script>
  const API_BASE = '/api';
  let anguloAtual = 0;

  document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('roletaItens');
      if (saved) {
          document.getElementById('inputItens').value = saved;
          atualizarRoleta();
      }
  });

  function desenharRoleta(itens) {
      const canvas = document.getElementById('roleta');
      const ctx = canvas.getContext('2d');
      const n = itens.length;
      const ang = 2 * Math.PI / n;
      const cores = ['#3a7d44','#5cb86a','#2a5c32','#7ec88a','#1e4a2a','#4a9a56','#93d49c','#265c30','#6ab87a','#1a3d22'];

      canvas.width = canvas.parentElement.offsetWidth || 360;
      canvas.height = canvas.parentElement.offsetWidth || 360;
      const r = canvas.width / 2;
      const cx = r, cy = r;

      for (let i = 0; i < n; i++) {
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, i * ang, (i + 1) * ang);
          ctx.fillStyle = cores[i % cores.length];
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.save();
          ctx.fillStyle = 'white';
          ctx.textAlign = 'center';
          ctx.font = \`bold \${Math.max(10, Math.min(14, r/n*1.5))}px Inter, Arial, sans-serif\`;
          ctx.translate(cx, cy);
          ctx.rotate(i * ang + ang / 2);
          ctx.fillText(itens[i].length > 16 ? itens[i].substring(0,14)+'…' : itens[i], r * 0.6, 5);
          ctx.restore();
      }
  }

  function atualizarRoleta() {
      const input = document.getElementById('inputItens').value;
      localStorage.setItem('roletaItens', input);
      const itens = input.split('\n').filter(i => i.trim());
      if (itens.length > 0) desenharRoleta(itens);
  }

  function sortear() {
      const input = document.getElementById('inputItens').value;
      localStorage.setItem('roletaItens', input);
      const itens = input.split('\n').filter(i => i.trim());
      if (!itens.length) return;
      desenharRoleta(itens);
      const canvas = document.getElementById('roleta');
      let velocidade = 50;
      const dec = 0.98;
      const intervalo = setInterval(() => {
          velocidade *= dec;
          anguloAtual += velocidade;
          canvas.style.transform = \`rotate(\${anguloAtual}deg)\`;
          if (velocidade < 0.5) {
              clearInterval(intervalo);
              const idx = Math.floor(((360 - (anguloAtual % 360)) / (360 / itens.length)) % itens.length);
              document.getElementById('resultadoTexto').textContent = \`🎉 \${itens[idx]}\`;
              document.querySelector('.modal-overlay').style.display = 'block';
              document.getElementById('modalResultado').style.display = 'block';
          }
      }, 30);
  }

  function fecharModal() {
      document.querySelector('.modal-overlay').style.display = 'none';
      document.getElementById('modalResultado').style.display = 'none';
  }
    </script>
    <script src="search.js"></script>
  </body>
</html>
